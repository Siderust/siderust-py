[package]
name = "siderust-interop-consumer"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "_siderust_interop_consumer"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.30.1"
siderust-py = { path = "../.." }
# Align with siderust-py 0.8 draft dependency until crates.io publishes 0.17.0.
siderust = { version = "0.17.0", git = "https://github.com/Siderust/siderust.git", rev = "087d7cf1e98dd32231cd3d4d570a8ad300eed087" }
tempoch-py = "0.5.0"
