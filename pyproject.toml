[build-system]
requires = ["maturin>=1.9.4,<2.0"]
build-backend = "maturin"

[project]
name = "siderust"
version = "0.2.2"
description = "Astrometry and astrodynamics for Python (powered by Rust)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "AGPL-3.0"}
authors = [
    {name = "VPRamon", email = "vallespuigramon@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
keywords = ["astronomy", "astrometry", "astrodynamics", "ephemeris", "rust"]

[project.urls]
Repository = "https://github.com/Siderust/siderust-py"
Documentation = "https://github.com/Siderust/siderust-py/tree/main/doc"

[tool.maturin]
python-source = "python"
module-name = "siderust._siderust"

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
python_files = ["test_*.py"]
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py38"
src = ["python", "tests", "examples"]
extend-exclude = ["dist", "siderust", "target"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.coverage.run]
branch = true
source = ["siderust"]

[tool.coverage.report]
fail_under = 90
show_missing = true
