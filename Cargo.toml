[package]
name = "siderust-py"
version = "0.1.0"
edition = "2021"
description = "Python bindings for siderust astrometry and astrodynamics"
license = "AGPL-3.0"
repository = "https://github.com/Siderust/siderust-py"
authors = ["VPRamon <vallespuigramon@gmail.com>"]

[lib]
name = "siderust_py"
crate-type = ["cdylib", "rlib"]

[dependencies]
siderust = { path = "siderust", features = [] }
qtty     = "0.8"
tempoch  = "0.7"
affn     = { version = "0.10", features = ["astro"] }
chrono   = "0.4.44"
pyo3     = { version = "0.29" }

[dev-dependencies]
pyo3    = { version = "0.29", features = ["auto-initialize"] }
approx  = "0.5"
