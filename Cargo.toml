[package]
name = "siderust-py"
version = "0.1.0"
edition = "2021"
description = "Python bindings for siderust astrometry and astrodynamics"
license = "AGPL-3.0"
repository = "https://github.com/Siderust/siderust"
authors = ["VPRamon <vallespuigramon@gmail.com>"]

[lib]
name = "siderust"  # Python import name
crate-type = ["cdylib"]

[dependencies]
siderust = { path = "../../rust/siderust", features = [] }
qtty     = "0.4.0"
tempoch  = "0.3"
affn     = { version = "0.3.3", features = ["astro"] }
chrono   = "0.4.44"
pyo3     = { version = "0.28.2", features = ["extension-module"] }

[dev-dependencies]
pyo3    = { version = "0.28.2", features = ["auto-initialize"] }
approx  = "0.5"

[patch.crates-io]
affn    = { path = "../../rust/affn" }
cheby   = { path = "../../rust/siderust/dev-deps/cheby" }
tempoch = { path = "../../rust/tempoch/tempoch" }
